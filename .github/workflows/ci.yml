name: CI

# Runs on every pull request, and as release.yml's required first job (`needs: ci`)
# on pushes to master, plus workflow_dispatch for manually running it standalone.
# Deploys are Vercel's Git integration, not a workflow (see CONTRIBUTING.md).
# typecheck ignores pre-existing errors in the auto-generated src/types/asyncapi/**
# model files (see packages/lib/scripts/typecheck.mjs); lint ignores that directory
# outright (see packages/lib/eslint.config.js). Both still gate on everything else.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (lib)
        run: npm run lint --workspace=packages/lib

      - name: Typecheck (lib)
        run: npm run typecheck --workspace=packages/lib

      - name: Test (lib)
        run: npm run test --workspace=packages/lib

      - name: Build library (lib)
        run: npm run build --workspace=packages/lib

      - name: Lint (web-component)
        run: npm run lint --workspace=packages/web-component

      - name: Typecheck (web-component)
        run: npm run typecheck --workspace=packages/web-component

      - name: Build web component
        run: npm run build --workspace=packages/web-component

      - name: Build playground
        run: npm run build --workspace=packages/playground
